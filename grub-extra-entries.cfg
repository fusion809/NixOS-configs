menuentry 'Arch Linux' --class arch --class gnu-linux --class gnu --class os $menuentry_id_option 'gnulinux-simple-1f93f091-b052-4802-a533-1a1977b99fdb' {
	load_video
	set gfxpayload=keep
	insmod gzio
	insmod part_gpt
	insmod fat
	set root='hd1,gpt1'
	if [ x$feature_platform_search_hint = xy ]; then
	  search --no-floppy --fs-uuid --set=root --hint-bios=hd1,gpt1 --hint-efi=hd1,gpt1 --hint-baremetal=ahci1,gpt1  2CB2-8CCD
	else
	  search --no-floppy --fs-uuid --set=root 2CB2-8CCD
	fi
	echo	'Loading Linux linux ...'
	linux	/vmlinuz-linux root=UUID=1f93f091-b052-4802-a533-1a1977b99fdb rw  loglevel=3 quiet
	echo	'Loading initial ramdisk ...'
	initrd	/initramfs-linux.img
}

menuentry 'Windows Boot Manager (on /dev/sdd2)' --class windows --class os $menuentry_id_option 'osprober-efi-AAAA-A7BA' {
	insmod part_gpt
	insmod fat
	set root='hd3,gpt2'
	if [ x$feature_platform_search_hint = xy ]; then
	  search --no-floppy --fs-uuid --set=root --hint-ieee1275='ieee1275//disk@0,gpt2' --hint-bios=hd3,gpt2 --hint-efi=hd3,gpt2 --hint-baremetal=ahci3,gpt2  AAAA-A7BA
	else
	  search --no-floppy --fs-uuid --set=root AAAA-A7BA
	fi
	chainloader /efi/Microsoft/Boot/bootmgfw.efi
}
