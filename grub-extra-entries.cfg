menuentry 'Arch Linux (rolling) (on /dev/sdc2)' --class arch --class gnu-linux --class gnu --class os $menuentry_id_option 'osprober-gnulinux-simple-1f93f091-b052-4802-a533-1a1977b99fdb' {
        insmod part_gpt
        insmod ext2
        set root='hd2,gpt2'
        if [ x$feature_platform_search_hint = xy ]; then
          search --no-floppy --fs-uuid --set=root --hint-ieee1275='ieee1275//disk@0,gpt2' --hint-bios=hd2,gpt2 --hint-efi=hd2,gpt2 --hint-baremetal=ahci2,gpt2  1f93f091-b052-4802-a533-1a1977b99fdb
        else
          search --no-floppy --fs-uuid --set=root 1f93f091-b052-4802-a533-1a1977b99fdb
        fi
        linux /boot/vmlinuz-linux root=/dev/sdc2
        initrd /boot/initramfs-linux.img
}

menuentry 'Windows Boot Manager (on /dev/sdb2)' --class windows --class os $menuentry_id_option 'osprober-efi-AAAA-A7BA' {
        insmod part_gpt
        insmod fat
        set root='hd1,gpt2'
        if [ x$feature_platform_search_hint = xy ]; then
          search --no-floppy --fs-uuid --set=root --hint-ieee1275='ieee1275//disk@0,gpt2' --hint-bios=hd1,gpt2 --hint-efi=hd1,gpt2 --hint-baremetal=ahci1,gpt2  AAAA-A7BA
        else
          search --no-floppy --fs-uuid --set=root AAAA-A7BA
        fi
        chainloader /efi/Microsoft/Boot/bootmgfw.efi
}