menuentry 'Arch Linux (rolling) (on /dev/sdb2)' --class arch --class gnu-linux --class gnu --class os $menuentry_id_option 'osprober-gnulinux-simple-1f93f091-b052-4802-a533-1a1977b99fdb' {
        insmod part_gpt
        insmod fat
        set root='hd1,gpt1'
        if [ x$feature_platform_search_hint = xy ]; then
          search --no-floppy --fs-uuid --set=root --hint-ieee1275='ieee1275//disk@0,gpt1' --hint-bios=hd1,gpt1 --hint-efi=hd1,gpt1 --hint-baremetal=ahci1,gpt1  2CB2-8CCD
        else
          search --no-floppy --fs-uuid --set=root 2CB2-8CCD
        fi
        linux /vmlinuz-linux root=UUID=1f93f091-b052-4802-a533-1a1977b99fdb
        initrd /initramfs-linux.img
}
