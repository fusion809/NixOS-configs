bind = $mod ALT, F9, hy3:focustab, index, 19
bind = $mod ALT, F10, hy3:focustab, index, 20


device {
    name = telink-wireless-receiver
    kb_layout = us,br
}

input {
    kb_layout = us,br
    follow_mouse = 1
    force_no_accel = true
}
bind = $mod, space, exec, hyprctl switchxkblayout current next
misc {
    # disable the builtin default wallpaper (set to 0 or -1 depending on version)
    force_default_wallpaper = 0

    # optionally hide the Hyprland logo/backdrop
    disable_hyprland_logo = true
}
ecosystem:no_update_news=true
