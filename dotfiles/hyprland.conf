plugin = $HOME/.local/share/hyprland/plugins/hy3_patched.so
######################################
# Environment variables
######################################
$browser = google-chrome-stable
$editor = antigravity
$fileManager = dolphin
$menu = rofi -show window
$terminal = alacritty
$NIXCFG = $HOME/GitHub/mine/config/NixOS-configs
# debug {
#     suppress_errors = true
# }

######################################
# AUTOSTART
######################################
# exec-once = $browser
exec-once = $NIXCFG/shell/hyprland/waybar-multi-start
exec-once = $NIXCFG/shell/hyprland/workspace-router
exec-once = bash -c "$NIXCFG/shell/hyprland/wallpaper systematic"
exec-once = virt-manager
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP DISPLAY
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP DISPLAY
exec-once = bash -c 'systemctl --user restart xdg-desktop-portal && systemctl --user restart xdg-desktop-portal-gtk xdg-desktop-portal-hyprland plasma-xdg-desktop-portal-kde'
exec-once = bash -c 'brave'
exec-once = bash -c 'discord'
exec-once = bash -c 'blueman-manager'
exec-once = bash -c 'sleep 3; google-chrome-stable'
exec-once = bash -c 'google-chrome-stable --profile-directory=Default --app-id=mdpkiolbdkhdjpekfbkbmhigcaggjagi'
exec-once = bash -c 'google-chrome-stable --profile-directory=Default --app-id=jneocipojkkahfcibhjaiilegofacenn'
exec-once = bash -c 'google-chrome-stable --profile-directory=Default --app-id=hnpfjngllnobngcgfapefoaidbinmjnm'
exec-once = bash -c 'google-chrome-stable --profile-directory=Default --app-id=akpamiohjfcnimfljfndmaldlcfphjmp'
exec-once = kitty -e --hold $NIXCFG/shell/hyprland/hyfetch-run
exec-once = winboat
exec-once = kdeconnect-app
exec-once = $fileManager $HOME/.files
# exec-once = $NIXCFG/shell/hyprland/ved-alacritty
# exec-once = $NIXCFG/shell/hyprland/ged-alacritty
exec-once = $NIXCFG/shell/hyprland/debian13
exec-once = $NIXCFG/shell/hyprland/ssh-debian-alacritty
exec-once = wl-paste --watch cliphist store &
exec-once = wl-clip-persist --clipboard regular &
exec-once = $NIXCFG/shell/hyprland/killOldSwayBg
exec-once = $NIXCFG/shell/hyprland/network-daemon
exec-once = $NIXCFG/shell/hyprland/gpu-daemon
exec-once = $NIXCFG/shell/hyprland/system-daemon
exec-once = /run/current-system/sw/bin/kdeconnectd
exec-once = $editor

exec-once = hyprctl configerrors > $NIXCFG/dotfiles/config_errors.log 2>&1
exec-once = hyprctl seterror disable

######################################
# GENERAL
######################################
general {
	gaps_in = 0
	gaps_out = 0
	layout = hy3
}

# Mod key
$mod = SUPER

######################################
# WINDOW MANAGEMENT
######################################

# Move floating windows with Mod + mouse
bind = $mod SHIFT, R, submap, resize
submap = resize
    # Resize with arrow keys
    bind = , h, resizeactive, -10 0
    bind = , l, resizeactive, 10 0
    bind = , k, resizeactive, 0 -10
    bind = , j, resizeactive, 0 10

    # Or with vim-style (hjkl) or arrows; choose your preference
    bind = , left,  resizeactive, -10 0
    bind = , right, resizeactive, 10 0
    bind = , up,    resizeactive, 0 -10
    bind = , down,  resizeactive, 0 10

    # Return to normal mode when you press Escape again
    bind = , escape, submap, reset
submap = reset
# Screenshots / screencast
bind = , Print, exec, $NIXCFG/shell/hyprland/screenshot
bindp = $mod, Print, exec, $NIXCFG/shell/hyprland/screenshot output
bindp = $mod SHIFT, Print, exec, $NIXCFG/shell/hyprland/screenshot screen

# start Rofi
bind = $mod, d, exec, rofi -show drun -show-icons -icon-theme "WhiteSur-dark"

# Launch Nerd fonts cheat sheet website
bind = $mod CTRL, f, exec, $browser https://www.nerdfonts.com/cheat-sheet

# Launch RuneScape NXT client
bind = $mod, o, exec, $NIXCFG/shell/hyprland/runescape

bind = $mod SHIFT, o, exec, $NIXCFG/shell/hyprland/outlive 

# Launch file manager
bind = $mod SHIFT, p, exec, $fileManager

# Launch NixOS packages website
bind = $mod CTRL, n, exec, $browser https://search.nixos.org/packages

# Launch NixOS options website
bind = $mod CTRL, o, exec, $browser https://search.nixos.org/options

# Repair the Nix store
bind = $mod CTRL, r, exec, $NIXCFG/shell/hyprland/repair

# Update the Nix store
bind = $mod CTRL, u, exec, $NIXCFG/shell/hyprland/update

# Launch NixOS options website
bind = $mod CTRL, w, exec, $browser https://wiki.nixos.org/

# Launch NixOS-configs edit
bind = $mod SHIFT, n, exec, $editor $NIXCFG

# Launch gtop
bind = $mod, g, exec, alacritty -e gtop

# hyfetch
bind = $mod, h, exec, kitty -e --hold $NIXCFG/shell/hyprland/hyfetch-run

# Launch virt-manager
bind = $mod, v, exec, virt-manager

# Run wallpaper systematic
bind = $mod, w, exec, $NIXCFG/shell/hyprland/wallpaper systematic
bind = $mod, z, exec, $NIXCFG/shell/hyprland/wallpaper systematic previous
bind = $mod, s, exec, $NIXCFG/shell/hyprland/wallpaper random
# Specify wallpaper
bind = $mod, n, exec, $NIXCFG/shell/hyprland/wallpaper-no-specify 

# Run Brave
bind = $mod, b, exec, brave

# Run Bluetooth Manager
bind = $mod SHIFT, b, exec, blueman-manager

# Run WhatsApp Web
bind = $mod, m, exec, /opt/google/chrome/google-chrome --profile-directory=Default --app-id=hnpfjngllnobngcgfapefoaidbinmjnm

# Launch Google Chat
bind = $mod, c, exec, /opt/google/chrome/google-chrome --profile-directory=Default --app-id=mdpkiolbdkhdjpekfbkbmhigcaggjagi

# Delete current wallpaper and load next wallpaper
bind = $mod, e, exec, $NIXCFG/shell/hyprland/wallpaper-rm

# Launch Duolingo
bind = $mod SHIFT, D, exec, /opt/google/chrome/google-chrome --profile-directory=Default --app-id=jneocipojkkahfcibhjaiilegofacenn

# Launch Facebook
bind = $mod SHIFT, F, exec, /opt/google/chrome/google-chrome --profile-directory=Default --app-id=kippjfofjhjlffjecoapiogbkgbpmgej

# Launch IG
bind = $mod SHIFT, I, exec, /opt/google/chrome/google-chrome --profile-directory=Default --app-id=akpamiohjfcnimfljfndmaldlcfphjmp
 
# Launch Quora
bind = $mod SHIFT, q, exec, /opt/google/chrome/google-chrome --profile-directory=Default --app-id=cechoboadpfjgoaooidphlandgelehhi

# Show open windows Rofi interface
bind = $mod SHIFT, w, exec, $menu 

######################################
# WINDOW NAVIGATION
######################################

# Focus (note: Hyprland uses l/r/u/d)
bind = $mod, left, hy3:movefocus, l
bind = $mod, down, hy3:movefocus, d
bind = $mod, up, hy3:movefocus, u
bind = $mod, right, hy3:movefocus, r

# Move windows
bind = $mod SHIFT, J, movewindow, l
bind = $mod SHIFT, K, movewindow, d
bind = $mod SHIFT, L, movewindow, u
bind = $mod SHIFT, semicolon, movewindow, r

bind = $mod SHIFT, left, hy3:movewindow, l
bind = $mod SHIFT, down, hy3:movewindow, d
bind = $mod SHIFT, up, hy3:movewindow, u
bind = $mod SHIFT, right, hy3:movewindow, r

# Fullscreen
bind = $mod, F, fullscreen

# Floating toggle
bind = $mod SHIFT, SPACE, togglefloating
# Kill window
bind = $mod, Q, hy3:killactive

# Kill Hyprland (logout)
# bind = $mod SHIFT, e, exec, hyprsession save mysession; hyprctl dispatch exit 
# bind = $mod CTRL, s, exec, hyprsession save mysession
# Shutdown / poweroff
bind = $mod SHIFT, s, exec, sudo poweroff

# Extra keys
bind = , XF86HomePage, exec, dolphin
bind = , XF86Calculator, exec, octave
# bind = , F11, exec, $NIXCFG/shell/hyprland/focus-chrome
# bind = , F12, exec, $NIXCFG/shell/hyprland/focus-nautilus
bind = $mod, r, exec, hyprctl reload; $NIXCFG/shell/hyprland/waybar-multi-start
# Show swaync notifications
# Show swaync notifications (fires on Super tap without other key)
# Using bindrt so it only fires on release and doesn't repeat,
# preventing it from interfering with Mod+R, Mod+F, etc.
bind = $mod, less, exec, swaync-client -t -sw
# Clear swaync notifications
bind = $mod, period, exec, swaync-client -C

