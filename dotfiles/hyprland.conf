plugin = $HOME/.local/share/hyprland/plugins/hy3.so
######################################
# Environment variables
######################################
$browser = google-chrome-stable
$editor = antigravity
$fileManager = nautilus
$menu = rofi -show window
$terminal = alacritty
$NIXCFG = $HOME/GitHub/mine/config/NixOS-configs
######################################
# AUTOSTART
######################################
exec-once = $browser
exec-once = waybar
exec-once = hyprsession load mysession
exec-once = bash -c "$NIXCFG/shell/hyprland/wallpaper systematic"
exec-once = virt-manager
exec-once = brave
exec-once = discord
exec-once = blueman-manager
exec-once = kitty -e --hold $NIXCFG/shell/hyprland/hyfetch-run
exec-once = winboat
exec-once = nautilus $HOME/.files
exec-once = $NIXCFG/shell/hyprland/ved-alacritty
exec-once = $NIXCFG/shell/hyprland/ged-alacritty
exec-once = $NIXCFG/shell/hyprland/debian13
exec-once = $NIXCFG/shell/hyprland/ssh-debian-alacritty
exec-once = wl-paste --watch cliphist store &
exec-once = wl-clip-persist --clipboard regular &
exec-once = $NIXCFG/shell/hyprland/killOldSwayBg
exec-once = $NIXCFG/shell/hyprland/network-daemon
exec-once = $NIXCFG/shell/hyprland/gpu-daemon
exec-once = $NIXCFG/shell/hyprland/system-daemon
######################################
# GENERAL
######################################
general {
	gaps_in = 0
	gaps_out = 0
	layout = hy3
}

# Mod key
$mod = SUPER

######################################
# WINDOW MANAGEMENT
######################################

# Move floating windows with Mod + mouse
bind = $mod SHIFT, R, submap, resize
submap = resize
    # Resize with arrow keys
    bind = , h, resizeactive, -10 0
    bind = , l, resizeactive, 10 0
    bind = , k, resizeactive, 0 -10
    bind = , j, resizeactive, 0 10

    # Or with vim-style (hjkl) or arrows; choose your preference
    bind = , left,  resizeactive, -10 0
    bind = , right, resizeactive, 10 0
    bind = , up,    resizeactive, 0 -10
    bind = , down,  resizeactive, 0 10

    # Return to normal mode when you press Escape again
    bind = , escape, submap, reset
submap = reset
# Screenshots / screencast
bind = , Print, exec, $NIXCFG/shell/hyprland/screenshot

# start Rofi
bind = $mod, d, exec, rofi -show drun -show-icons -icon-theme "WhiteSur-dark"

# Launch Nerd fonts cheat sheet website
bind = $mod CTRL, f, exec, $browser https://www.nerdfonts.com/cheat-sheet

# Launch RuneScape NXT client
bind = $mod, o, exec, $NIXCFG/shell/hyprland/runescape

# Launch Nautilus
bind = $mod SHIFT, p, exec, $fileManager

# Launch NixOS packages website
bind = $mod CTRL, n, exec, $browser https://search.nixos.org/packages

# Launch NixOS options website
bind = $mod CTRL, o, exec, $browser https://search.nixos.org/options

# Repair the Nix store
bind = $mod CTRL, r, exec, $NIXCFG/shell/hyprland/repair

# Update the Nix store
bind = $mod CTRL, u, exec, $NIXCFG/shell/hyprland/update

# Launch NixOS options website
bind = $mod CTRL, w, exec, $browser https://wiki.nixos.org/

# Launch NixOS-configs edit
bind = $mod SHIFT, n, exec, $editor $NIXCFG

# Launch gtop
bind = $mod, g, exec, alacritty -e gtop

# hyfetch
bind = $mod, h, exec, kitty -e --hold $NIXCFG/shell/hyprland/hyfetch-run

# Launch virt-manager
bind = $mod, v, exec, virt-manager

# Run wallpaper systematic
bind = $mod, w, exec, $NIXCFG/shell/hyprland/wallpaper systematic
bind = $mod, z, exec, $NIXCFG/shell/hyprland/wallpaper systematic previous
bind = $mod, s, exec, $NIXCFG/shell/hyprland/wallpaper random
# Specify wallpaper
bind = $mod, n, exec, $NIXCFG/shell/hyprland/wallpaper-no-specify 

# Run Brave
bind = $mod, b, exec, brave

# Run Bluetooth Manager
bind = $mod SHIFT, b, exec, blueman-manager

# Run WhatsApp Web
bind = $mod, m, exec, /opt/google/chrome/google-chrome --profile-directory=Default --app-id=hnpfjngllnobngcgfapefoaidbinmjnm

# Launch Google Chat
bind = $mod, c, exec, /opt/google/chrome/google-chrome --profile-directory=Default --app-id=mdpkiolbdkhdjpekfbkbmhigcaggjagi

# Delete current wallpaper and load next wallpaper
bind = $mod, e, exec, $NIXCFG/shell/hyprland/wallpaper-rm

# Launch Duolingo
bind = $mod SHIFT, D, exec, /opt/google/chrome/google-chrome --profile-directory=Default --app-id=jneocipojkkahfcibhjaiilegofacenn

# Launch Facebook
bind = $mod SHIFT, F, exec, /opt/google/chrome/google-chrome --profile-directory=Default --app-id=kippjfofjhjlffjecoapiogbkgbpmgej

# Launch IG
bind = $mod SHIFT, I, exec, /opt/google/chrome/google-chrome --profile-directory=Default --app-id=akpamiohjfcnimfljfndmaldlcfphjmp
 
# Launch Quora
bind = $mod SHIFT, q, exec, /opt/google/chrome/google-chrome --profile-directory=Default --app-id=cechoboadpfjgoaooidphlandgelehhi

# Show open windows Rofi interface
bind = $mod SHIFT, w, exec, $menu 

######################################
# WINDOW NAVIGATION
######################################

# Focus (note: Hyprland uses l/r/u/d)
bind = $mod, left, movefocus, l
bind = $mod, down, movefocus, d
bind = $mod, up, movefocus, u
bind = $mod, right, movefocus, r

# Move windows
bind = $mod SHIFT, J, movewindow, l
bind = $mod SHIFT, K, movewindow, d
bind = $mod SHIFT, L, movewindow, u
bind = $mod SHIFT, semicolon, movewindow, r

bind = $mod SHIFT, left, hy3:movewindow, l
bind = $mod SHIFT, down, hy3:movewindow, d
bind = $mod SHIFT, up, hy3:movewindow, u
bind = $mod SHIFT, right, hy3:movewindow, r

# Fullscreen
bind = $mod, F, fullscreen

# Floating toggle
bind = $mod SHIFT, SPACE, togglefloating
# Kill window
bind = $mod, Q, hy3:killactive

# Kill Hyprland (logout)
bind = $mod SHIFT, e, exec, hyprsession save mysession; hyprctl dispatch exit 
bind = $mod CTRL, s, exec, hyprsession save mysession
# Shutdown / poweroff
bind = $mod SHIFT, s, exec, sudo poweroff

# Extra keys
bind = , XF86HomePage, exec, nautilus
bind = , XF86Calculator, exec, octave
# bind = , F11, exec, $NIXCFG/shell/hyprland/focus-chrome
# bind = , F12, exec, $NIXCFG/shell/hyprland/focus-nautilus
bind = $mod, r, exec, hyprctl reload; pkill waybar; waybar

######################################
# WORKSPACES
######################################
# Monitor rules
monitor = HDMI-A-1, preferred, 0x0, 1
monitor = DVI-D-1, preferred, 1920x0, 1

# Workspace bindings
workspace = 1, monitor:HDMI-A-1, default:true
workspace = 2, monitor:HDMI-A-1
workspace = 3, monitor:DVI-D-1
workspace = 4, monitor:DVI-D-1
workspace = 5, monitor:HDMI-A-1
workspace = 6, monitor:DVI-D-1
workspace = 7, monitor:HDMI-A-1
workspace = 8, monitor:DVI-D-1, default:true
workspace = 9, monitor:DVI-D-1
workspace = 10, monitor:DVI-D-1
workspace = 11, monitor:DVI-D-1
workspace = 12, monitor:DVI-D-1
workspace = 13, monitor:DVI-D-1
workspace = 14, monitor:DVI-D-1
workspace = 15, monitor:HDMI-A-1
workspace = 16, monitor:HDMI-A-1
workspace = 17, monitor:DVI-D-1
workspace = 18, monitor:HDMI-A-1
workspace = 19, monitor:DVI-D-1
workspace = 20, monitor:DVI-D-1
workspace = 21, monitor:HDMI-A-1
workspace = 22, monitor:DVI-D-1
workspace = 23, monitor:DVI-D-1
workspace = 24, monitor:DVI-D-1
workspace = 25, monitor:HDMI-A-1
workspace = 26, monitor:DVI-D-1
workspace = 27, monitor:DVI-D-1
workspace = 28, monitor:DVI-D-1
workspace = 29, monitor:DVI-D-1
workspace = 30, monitor:DVI-D-1

# Move current workspace to specific monitor
bind = $mod CTRL, 2, exec, hyprctl dispatch moveworkspacetomonitor $(hyprctl activeworkspace -j | jq .id) 0
bind = $mod CTRL, 1, exec, hyprctl dispatch moveworkspacetomonitor $(hyprctl activeworkspace -j | jq .id) 1

# Switch workspaces
bind = , F1, workspace, 1
bind = $mod, 2, workspace, 2
bind = , F3, workspace, 3
bind = , F4, workspace, 4
bind = , F5, workspace, 5
bind = , F6, workspace, 6
bind = , F7, workspace, 7
bind = , F8, workspace, 8
bind = , F9, workspace, 9
bind = , F10, workspace, 10

bind = , F11, workspace, 11
bind = , F12, workspace, 12
bind = $mod, Print, workspace, 13
bind = , Pause, workspace, 14
bind = , Insert, workspace, 15
bind = , Home, workspace, 16
bind = , Page_Up, workspace, 17
bind = $mod, Delete, workspace, 18
bind = , End, workspace, 19
bind = , Page_Down, workspace, 20

bind = $mod, F1, workspace, 21
bind = $mod, F2, workspace, 22
bind = $mod, F3, workspace, 23
bind = $mod, F4, workspace, 24
bind = $mod, F5, workspace, 25
bind = $mod, F6, workspace, 26
bind = $mod, F7, workspace, 27
bind = $mod, F8, workspace, 28
bind = $mod, F9, workspace, 29
bind = $mod, F10, workspace, 30

# Move windows to workspace
bind = $mod SHIFT, 1, movetoworkspacesilent, 1
bind = $mod SHIFT, 2, movetoworkspacesilent, 2
bind = $mod SHIFT, 3, movetoworkspacesilent, 3
bind = $mod SHIFT, 4, movetoworkspacesilent, 4
bind = $mod SHIFT, 5, movetoworkspacesilent, 5
bind = $mod SHIFT, 6, movetoworkspacesilent, 6
bind = $mod SHIFT, 7, movetoworkspacesilent, 7
bind = $mod SHIFT, 8, movetoworkspacesilent, 8
bind = $mod SHIFT, 9, movetoworkspacesilent, 9
bind = $mod SHIFT, 0, movetoworkspacesilent, 10

bind = $mod SHIFT, F1, movetoworkspacesilent, 11
bind = $mod SHIFT, F2, movetoworkspacesilent, 12
bind = $mod SHIFT, F3, movetoworkspacesilent, 13
bind = $mod SHIFT, F4, movetoworkspacesilent, 14
bind = $mod SHIFT, F5, movetoworkspacesilent, 15
bind = $mod SHIFT, F6, movetoworkspacesilent, 16
bind = $mod SHIFT, F7, movetoworkspacesilent, 17
bind = $mod SHIFT, F8, movetoworkspacesilent, 18
bind = $mod SHIFT, F9, movetoworkspacesilent, 19
bind = $mod SHIFT, F10, movetoworkspacesilent, 20

bind = $mod SHIFT, F11, movetoworkspacesilent, 21
bind = $mod SHIFT, F12, movetoworkspacesilent, 22
bind = $mod SHIFT, Print, movetoworkspacesilent, 23
bind = $mod SHIFT, Pause, movetoworkspacesilent, 24
bind = $mod SHIFT, Insert, movetoworkspacesilent, 25
bind = $mod SHIFT, Home, movetoworkspacesilent, 26
bind = $mod SHIFT, Page_Up, movetoworkspacesilent, 27
bind = $mod SHIFT, Delete, movetoworkspacesilent, 28
bind = $mod SHIFT, End, movetoworkspacesilent, 29
bind = $mod SHIFT, Page_Down, movetoworkspacesilent, 30

######################################
# TERMINAL
######################################

bind = $mod, tab, exec, $terminal
bind = $mod, RETURN, exec, $terminal
bind = $mod, k, exec, kitty
# Launch gtop
bind = $mod, g, exec, alacritty -e gtop
# Focus terminal
bind = $mod SHIFT, tab, exec, focus-terminal

######################################
# SYSTEM CONTROLS
######################################

# Volume/media keys
bind = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bind = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

# Window rules
windowrule = opacity 0.8 0.8, match:class ^Alacritty$
windowrule = opacity 0.6 0.6, match:class ^kitty$
windowrule = workspace 2, match:initial_class kitty
windowrule = float 1, match:initial_class kitty
windowrule = size 815 385, match:initial_class kitty
windowrule = move 1104 694, match:initial_class kitty
windowrule = workspace 1, match:initial_class google-chrome
windowrule = workspace 1, match:initial_class mousepad
windowrule = workspace 5, match:initial_class Code
windowrule = workspace 5, match:initial_class antigravity
windowrule = workspace 11, match:initial_class .virt-manager-wrapped
windowrule = workspace 29, match:initial_class virt-viewer
windowrule = workspace 14, match:initial_class brave-browser
windowrule = workspace 1, match:initial_class gcr-prompter
windowrule = workspace 1, match:initial_class org.gnome.TextEditor
windowrule = workspace 13, match:initial_class discord
windowrule = workspace 1, match:initial_class org.kde.ksecretd
windowrule = workspace 21, match:initial_class steam
windowrule = workspace 12, match:title "Google Chat - Chat"
windowrule = workspace 12, match:title "WhatsApp Web"
windowrule = float 1, match:initial_class SpaceCadetPinball
windowrule = float 1, match:initial_class eog
windowrule = float 1, match:initial_class org.gnome.eog
windowrule = size 1000 700, match:initial_class eog
windowrule = size 1000 700, match:initial_class org.gnome.eog
windowrule = center 1, match:initial_class eog
windowrule = center 1, match:initial_class org.gnome.eog
#windowrule = tile 1, match:initial_class install4j-chemaxon-marvin-Sketch_msketch
windowrule = tile 1, match:initial_class steam_app_1343400
windowrule = workspace 3, match:initial_class .blueman-manager-wrapped
windowrule = workspace 4, match:initial_class winboat
windowrule = workspace 6, match:initial_class xfreerdp
windowrule = workspace 5, match:initial_class ^DiscoveryStudio2025-bin$
windowrule = workspace 5, match:initial_class ^org.openchemistry.Avogadro2$
windowrule = workspace 5, match:initial_class ^PyMOL$
windowrule = workspace 5, match:initial_class ^org-openscience-jmol-app-jmolpanel-JmolPanel$
windowrule = workspace 5, match:initial_class ^install4j-chemaxon-marvin-Sketch_msketch$
windowrule = workspace 7, match:title ^ved$
windowrule = workspace 7, match:initial_title ^ged$
windowrule = workspace 8, match:initial_class org.gnome.Nautilus
windowrule = workspace 9, match:initial_class steam_app_1343400
windowrule = workspace 25, match:initial_class vlc
windowrule = workspace 22, match:initial_class steam_app_218620
env = HYPRCURSOR_THEME,"Future-Cyan-Hyprcursor_Theme"
env = HYPRCURSOR_SIZE,24
plugin {
    hy3 {
	tabs {
		border_width = 0
		col.active = rgba(ff55ffff)
		col.active.text = rgba(00000000)
		col.inactive = rgba(333333ff)
		col.inactive.text = rgba(ffffffff)
		col.urgent = rgba(ff0000ff)
		col.urgent.text = rgba(000000ff)
	}
        autotile {
            enable = true
            trigger_width = 800
            trigger_height = 500
        }
    }
}
bind = $mod, t, hy3:makegroup, tab
bind = $mod, a, hy3:expand, expand
#bind = $mod Shift, n, hy3:focustab, r
bind = $mod Shift, p, hy3:focustab, l
bind = $mod, x, exec, $NIXCFG/shell/hyprland/focustab-no
bind = $mod ALT, 1, hy3:focustab, index, 1
bind = $mod ALT, 2, hy3:focustab, index, 2
bind = $mod ALT, 3, hy3:focustab, index, 3
bind = $mod ALT, 4, hy3:focustab, index, 4
bind = $mod ALT, 5, hy3:focustab, index, 5
bind = $mod ALT, 6, hy3:focustab, index, 6
bind = $mod ALT, 7, hy3:focustab, index, 7
bind = $mod ALT, 8, hy3:focustab, index, 8
bind = $mod ALT, 9, hy3:focustab, index, 9
bind = $mod ALT, 0, hy3:focustab, index, 10
bind = $mod ALT, F1, hy3:focustab, index, 11
bind = $mod ALT, F2, hy3:focustab, index, 12
bind = $mod ALT, F3, hy3:focustab, index, 13
bind = $mod ALT, F4, hy3:focustab, index, 14
bind = $mod ALT, F5, hy3:focustab, index, 15
bind = $mod ALT, F6, hy3:focustab, index, 16
bind = $mod ALT, F7, hy3:focustab, index, 17
